name: Documentation and assets
on:
  push:
    paths: ['README.md', 'docs/**', 'scripts/verify_repository.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['README.md', 'docs/**', 'scripts/verify_repository.py', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_repository.py
