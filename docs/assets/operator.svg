   <g id="text_1">
    <text style="font-weight: 700; font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #edf6ff" x="50.4" y="42.598375" transform="rotate(-0 50.4 42.598375)">Inside one CARS head</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #9fb4ce" x="50.4" y="92.423125" transform="rotate(-0 50.4 92.423125)">Transform history, read it, then correct it with current evidence.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ae91ff" x="131.04" y="198.675863" transform="rotate(-0 131.04 198.675863)">Previous state</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #9fb4ce" x="131.04" y="234.432335" transform="rotate(-0 131.04 234.432335)">S(t-1)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #38dbc2" x="423.36" y="198.617269" transform="rotate(-0 423.36 198.617269)">Transport + decay</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #9fb4ce" x="423.36" y="234.432335" transform="rotate(-0 423.36 234.432335)">Sbar = delta S(t-1) T</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffca70" x="791.28" y="198.675863" transform="rotate(-0 791.28 198.675863)">Read BEFORE write</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #9fb4ce" x="791.28" y="234.432335" transform="rotate(-0 791.28 234.432335)">r = Sbar q</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffca70" x="791.28" y="393.449269" transform="rotate(-0 791.28 393.449269)">Normalize + project</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #9fb4ce" x="791.28" y="429.264335" transform="rotate(-0 791.28 429.264335)">read RMSNorm / scale -&gt; output</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ae91ff" x="161.28" y="393.507862" transform="rotate(-0 161.28 393.507862)">Current evidence</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #9fb4ce" x="161.28" y="429.264335" transform="rotate(-0 161.28 429.264335)">K: key directions / V: values</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #38dbc2" x="463.68" y="393.449269" transform="rotate(-0 463.68 393.449269)">Ridge correction</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #9fb4ce" x="463.68" y="429.264335" transform="rotate(-0 463.68 429.264335)">E = V - Sbar K</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #38dbc2" x="50.4" y="536.050937" transform="rotate(-0 50.4 536.050937)">S(t) = Sbar + E (K^T K + lambda I)^(-1) K^T</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #9fb4ce" x="50.4" y="569.543375" transform="rotate(-0 50.4 569.543375)">T is a Cayley transform; lambda &gt; 0. Ridge is computed with Cholesky solves. Recurrence stays FP32.</text>
   </g>
  </g>
 </g>
